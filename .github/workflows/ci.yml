# Root CI — the only workflows GitHub Actions reads are the ones in the
# repository root. The Laravel skeleton's backend/.github/ never ran.
name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Действия закреплены по SHA, а не по тегу.
#
# Тег — изменяемая ссылка: владелец действия может переставить `v4` на другой
# коммит, и в ворота поедет чужой код без единой правки у нас. Это не
# умозрительно: у `shivammathur/setup-php` на 03.10 тег `v2` указывает на тот
# же коммит, что и `master`, — то есть «версия 2» и есть текущая вершина
# разработки.
#
# Комментарий рядом с SHA — для человека: SHA не читается глазами. Обновляет
# их Dependabot (экосистема `github-actions` в .github/dependabot.yml), он же
# переписывает и комментарий.

jobs:
  # Посторонние файлы в исходниках. 04.09 в frontend/src/components нашлись
  # десять файлов вне git — доредакторные PostCard.tsx, CommentSection.tsx и
  # финдеровские дубли. Никто их не импортировал, но tsc компилирует всё под
  # src/ и насчитывал по ним 20 ошибок, сбивая порог перед мержем.
  #
  # На свежем чекауте неотслеживаемых файлов не бывает, поэтому здесь реально
  # срабатывает только проверка закоммиченных дублей — «vitest.config 2.ts»
  # пролежал в репозитории с июля. Остальные две проверки того же скрипта
  # смысл имеют локально, до коммита: запускайте deploy/scripts/check-workspace.sh.
  workspace:
    name: hygiene · нет посторонних файлов
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: deploy/scripts/check-workspace.sh
      # Кеш конфигурации — запечённый .env с паролем базы. `config:cache`
      # создаёт его с правами 644, и каждый вызывающий скрипт обязан вернуть
      # 640. 08.09 в CLAUDE.md записали, что так и есть; 10.09 пересчёт
      # показал десять скриптов без этого. Ничто не проверяло — теперь
      # проверяет.
      - run: deploy/scripts/check-config-cache-chmod.sh
      # Пустой `.catch(() => {})` стирает отказ без следа: запрос падает,
      # человек видит пустой список вместо сообщения. 11.09 таких мест было
      # 76, теперь ноль. Правило eslint есть, но предупреждением — уровень у
      # no-restricted-syntax один на все селекторы, и поднять его до ошибки
      # значило бы сделать ошибками полторы тысячи предупреждений про px.
      - run: deploy/scripts/check-empty-catch.sh
      # Выкатка 29.09 закончилась словом DONE при несобравшемся фронте:
      # сборка упала по нехватке кучи Node, ссылка осталась на прежнем
      # релизе, сайт отдавал вчерашний фронтенд. Проверка запускает сам
      # deploy-remote.sh в подменном дереве — дважды, со сломанной сборкой
      # и с целой, — и требует FAILED в первом случае и DONE во втором.
      # Денежный адрес не подставляется молча. Умолчанием адреса эквайринга
      # была песочница ВТБ, у выплат — epa-ift-sbp и test3.api.vtb. Контур с
      # ключами и enabled=true считал себя настроенным и слал заказы в
      # испытательный узел: на проде так прошло больше месяца, и снаружи это
      # не видно ничем — платёж создаётся и возвращает ссылку на форму банка.
      # Вписать «удобный» адрес обратно — правка в одну строку.
      - run: deploy/scripts/check-no-sandbox-defaults.sh
      # Проверка, которая не умеет провалиться, опаснее отсутствующей.
      # 03.10 при попытке поставить nginx-drift.sh в ворота выяснилось, что он
      # печатает «ok — боевой nginx совпадает с репозиторием» там, где нет ни
      # репозитория, ни nginx. Рядом нашлись ещё три, отвечавшие нулём на
      # «каталог не похож на приложение». Ответов должно быть три: 0 сошлось,
      # 1 разошлось, 2 выяснить не удалось.
      - run: deploy/scripts/tests/checks-cannot-pass-blindly.sh
      # Совет должен соответствовать причине. На закрытом репозитории проверка
      # CI отвечала «задайте GH_TOKEN или подождите» при 55 свободных запросах
      # из 60 — то есть отправляла ждать то, что не наступит: без токена
      # GitHub отвечает 404 на сам репозиторий.
      - run: deploy/scripts/tests/ci-status-tells-the-cause.sh
      # Правило «документация и код в одном коммите» слиянием не выполнить:
      # в сливаемом наборе лежит всё, что принесла другая ветка. До 03.10 оно
      # упиралось на каждом слиянии с конфликтом и требовало --no-verify,
      # который снимает заодно и остальные проверки.
      - run: deploy/scripts/tests/hook-lets-merges-through.sh
      # Кеш конфигурации выкатка не пересобирала вовсе: на проде он лежал от
      # 11 сентября, и три недели любая правка в config/ до прода не доезжала.
      # Молчаливее кеша маршрутов — отсутствующий маршрут даёт 404, а старое
      # умолчание отвечает двести, просто не тем значением.
      - run: deploy/scripts/tests/deploy-rebuilds-config-cache.sh
      - run: deploy/scripts/tests/deploy-remote-says-failed.sh

  frontend:
    name: frontend · tsc + eslint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      # Same contract as the deploy script: the lockfile must already match
      # package.json. A drift fails here instead of on the server.
      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      # Must run before tsc: the build generates src/routeTree.gen.ts, and without it
      # every route import resolves to nothing and the type-error count is fiction.
      #
      # Предел кучи — тот же, что у боевой выкатки (deploy-frontend.sh). Без него
      # здесь действовало умолчание V8, на ubuntu-latest это 2077 МБ, а сборке
      # нужно больше двух гигабайт: замер 03.10 дал отказ на 2048 и успех на 3072.
      # Выкатка это знала и ставила 4096 с самого начала; ворота — нет, и потому
      # падали там, где прод собирался. Красный шаг назывался «tsc + eslint», до
      # которых дело не доходило вовсе.
      - name: Build
        run: bun run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      # tsc — ворота. Ноль ошибок, без послаблений.
      #
      # Порог был 39, и это его и убивало: тридцать девять существующих ошибок
      # — отличное место, чтобы спрятать сороковую. Закрыты все 08.09, из них
      # двенадцать — расхождение состава локалей (его теперь ловит ещё и
      # locales.test.ts, потому что tsc сообщает про первый недостающий ключ и
      # молчит про остальные двести).
      #
      # Сборка обязана идти перед tsc: она создаёт src/routeTree.gen.ts, без
      # которого не разрешается ни один импорт маршрута и число ошибок —
      # выдумка. На сервере это стоило дня разбора: в основном чекауте tsc
      # показывал 141 при тех же тридцати девяти в дереве сборки.
      - name: tsc
        run: |
          set +e
          npx tsc --noEmit > "$RUNNER_TEMP/tsc.log" 2>&1
          status=$?
          count=$(grep -c "error TS" "$RUNNER_TEMP/tsc.log")
          {
            echo "## tsc — $count error(s)"
            echo
            echo "Ворота: ноль ошибок."
            echo
            echo "<details><summary>Errors by code</summary>"
            echo
            echo '```'
            grep -o "error TS[0-9]*" "$RUNNER_TEMP/tsc.log" | sort | uniq -c | sort -rn
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      # Проверки фронтенда — ворота, а не украшение.
      #
      # До 22.09 их не было ни здесь, ни в скриптах выкатки: три сотни
      # проверок были зелёными ровно до тех пор, пока кто-то запускал их
      # руками. Регрессия в чистой функции — разборе адреса, расчёте посылки,
      # подписи кнопки — доезжала бы до прода при зелёном CI.
      #
      # После сборки: она создаёт src/routeTree.gen.ts, без которого не
      # разрешается ни один импорт маршрута.
      - name: vitest
        run: bun run test

      # Ошибок больше нет — все 191 были prettier/prettier и вычищены
      # автофиксом 08.09. Шаг стал воротами: ни одной ошибки и не больше
      # 1518 предупреждений (текущий порог; 1451 из них — точные px вместо
      # шкалы Tailwind). Порог только вниз: новый код не должен его двигать.
      - name: eslint
        run: |
          set +e
          npx eslint . --max-warnings=1518 -f json -o "$RUNNER_TEMP/eslint.json"
          status=$?
          if [ -s "$RUNNER_TEMP/eslint.json" ]; then
            node -e '
              const fs = require("fs");
              const files = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              const errors = files.reduce((n, f) => n + f.errorCount, 0);
              const warnings = files.reduce((n, f) => n + f.warningCount, 0);
              const rules = new Map();
              for (const f of files)
                for (const m of f.messages)
                  if (m.severity === 2) rules.set(m.ruleId ?? "(parse error)", (rules.get(m.ruleId ?? "(parse error)") ?? 0) + 1);
              const top = [...rules].sort((a, b) => b[1] - a[1]);
              const out = [
                `## eslint — ${errors} error(s), ${warnings} warning(s)`,
                "",
                "Ворота: 0 ошибок, не более 1518 предупреждений.",
                "",
                "<details><summary>Errors by rule</summary>",
                "",
                "```",
                ...top.map(([rule, n]) => `${String(n).padStart(5)} ${rule}`),
                "```",
                "",
                "</details>",
                "",
              ].join("\n");
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, out);
            ' "$RUNNER_TEMP/eslint.json"
          else
            echo "## eslint — did not produce a report (see the step log)" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $status

  backend:
    name: backend · phpunit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          # Matches backend/.env.testing.example; tests refuse any other database name.
          POSTGRES_DB: modelizmclub_test
          POSTGRES_USER: modelizmclub
          POSTGRES_PASSWORD: secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U modelizmclub -d modelizmclub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.3"
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_pgsql, pgsql, bcmath, gd, intl
          coverage: none

      - name: Composer cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install
        run: composer install --prefer-dist --no-interaction --no-progress

      # Запасной кодировщик AVIF — тот же пакет, что на проде. Ubuntu-шный
      # libgd3 собран без libavif, и `imageavif` в PHP может не быть; тогда
      # варианты кодирует avifenc. Без этого шага тесты этого пути в CI
      # пропускались бы, и проверялся бы только тот кодировщик, которого на
      # проде нет.
      - name: libavif-bin
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libavif-bin

      - name: Testing env
        run: |
          cp .env.testing.example .env.testing
          php artisan key:generate --env=testing --force

      - name: phpunit
        run: php artisan test --env=testing

      # The test database is built from the migrations, so nothing here can see
      # an object that exists only on production — that is how the August escrow
      # leftovers stayed invisible until a migration tripped over them in
      # September. What CI can check is that the committed baseline still
      # matches what the migrations produce, so the file production is compared
      # against after every deploy never goes stale.
      - name: Schema baseline is current
        run: |
          # This job runs inside backend/, hence the ../ on the script path.
          cp .env.testing .env  # the drift script reads backend/.env

          # Диагностика в summary. Логи шага требуют токена, а summary виден
          # на публичной странице прогона без него. Этот шаг падал с 04.09
          # из-за лишней кавычки после `exit 1`: тело run не разбиралось
          # shell-ом и завершалось до первой команды — проверка ни разу не
          # выполнилась. Причину искали снаружи, потому что изнутри шаг
          # ничего о себе не сообщал.
          {
            echo "## Schema baseline — окружение"
            echo ""
            echo '```'
            echo "psql:        $(psql --version 2>&1 | head -1)"
            echo "createdb:    $(command -v createdb || echo 'нет в PATH')"
            echo "DB_DATABASE: $(grep -m1 '^DB_DATABASE=' .env | cut -d= -f2-)"
            echo "DB_USERNAME: $(grep -m1 '^DB_USERNAME=' .env | cut -d= -f2-)"
            echo "LC_ALL:      ${LC_ALL:-не задан}   LANG: ${LANG:-не задан}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          SCHEMA_BASELINE=/tmp/objects.generated.txt ../deploy/scripts/schema-drift.sh --update-baseline
          echo "schema-drift.sh exit: $?" >> "$GITHUB_STEP_SUMMARY"
          if diff -u database/schema/objects.txt /tmp/objects.generated.txt > /tmp/schema.diff; then
            echo "## Schema baseline" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Matches the migrations — $(grep -c . database/schema/objects.txt) objects." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Schema baseline is stale"
              echo ""
              echo "The migrations no longer produce the committed baseline."
              echo "Run \`deploy/scripts/schema-drift.sh --update-baseline\` and commit the result,"
              echo "otherwise the post-deploy drift check compares production against an outdated file."
              echo ""
              echo '```diff'
              head -60 /tmp/schema.diff
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # Дерево категорий и карта доступа — два сторожа, которые до 03.10
      # работали только после выкатки. Там они полезны, но поздно: карта
      # решает, кто что видит, а по `path` идёт отбор потомков, и расхождение
      # уезжает на прод вместе с веткой. В CI они проверяют то, что CI может:
      # что наполнение проекта даёт согласованное дерево и карту, совпадающую
      # с умолчаниями реестра.
      #
      # База собирается заново с наполнением: после `php artisan test` она
      # остаётся в том состоянии, в каком её бросил последний тест, и
      # проверять такое бессмысленно.
      - name: База с наполнением для сверок
        run: |
          cp .env.testing .env
          php artisan migrate:fresh --seed --force

      # Два шага, а не один: GitHub даёт `bash -eo pipefail`, и отказ первой
      # сверки скрыл бы вторую — за сборку было бы видно одно расхождение из
      # двух.
      - name: Дерево категорий согласовано
        run: ../deploy/scripts/category-tree-drift.sh

      - name: Карта доступа совпадает с реестром
        if: always()
        run: ../deploy/scripts/access-map-drift.sh --strict

  prod-install:
    name: backend · установка без dev-зависимостей
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.3"
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_pgsql, pgsql, bcmath, gd, intl
          coverage: none

      - name: Composer cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      # Боевая установка ставит только require, а тесты и локальная разработка
      # — весь набор. Значит ссылка из app/ на пакет из require-dev проходит
      # все остальные ворота и ломается ровно один раз: на проде.
      #
      # Так и вышло 10.09. `composer install --no-dev` дошёл до
      # package:discover, тот позвал AppServiceProvider, а тот — Scramble из
      # require-dev. API отдавал 500 четыре минуты. Ни один шаг CI этого не
      # видел, потому что ни один не ставил зависимости так, как их ставят на
      # боевом сервере.
      #
      # Отдельный php artisan не нужен: package:discover уже поднимает
      # приложение внутри composer install и роняет установку кодом 1.
      # route:list добавлен вторым слоем — он проходит по всем маршрутам и
      # ловит то, что до провайдеров не доходит.
      - name: composer install --no-dev
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress

      - name: Приложение поднимается без dev-зависимостей
        run: |
          cp .env.testing.example .env
          php artisan key:generate --force
          php artisan route:list --json > /dev/null

  # Зависимости фронтенда не смотрел никто. Разбор безопасности GitHub 03.10:
  # `composer audit` в CI был, `bun audit` — нигде, при 36 уязвимостях на тот
  # день. Находить их ходили руками, то есть не находили.
  #
  # Тоже предупреждением, как и composer: `bun audit` выходит кодом 1 при любой
  # находке, а блокировать PR из-за уязвимости в инструменте сборки нельзя — из
  # 36 на 03.10 достижимых извне было ноль (проверено поиском каждого пакета в
  # боевой сборке Nitro: ни одного в `.output/server`). Поэтому `|| true` и
  # сводка: ворота должны останавливать то, что мы сломали, а не то, что
  # сломали в чужом пакете.
  #
  # `--audit-level=high` в сводке отдельной строкой: полный список длинный и
  # его перестают читать, а высокие стоит видеть сразу.
  audit-frontend:
    name: frontend · bun audit
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: bun audit → summary
        run: |
          {
            echo "## bun audit"
            echo
            echo "### Высокие и выше"
            echo
            echo '```'
            bun audit --audit-level=high 2>&1 || true
            echo '```'
            echo
            echo "<details><summary>Полный список</summary>"
            echo
            echo '```'
            bun audit 2>&1 || true
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

  audit:
    name: backend · composer audit
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.3"
          coverage: none

      # Advisory only: the report lands in the job summary, the job never blocks a PR.
      - name: composer audit → summary
        run: |
          {

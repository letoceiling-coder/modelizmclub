# Неизвестный домен не обслуживается.
#
# `default_server` не стоял нигде, поэтому запрос с чужим именем хоста
# доставался первому по порядку загрузки блоку — `api.modelizmclub.ru`, — и
# сайт отвечал на любое доменное имя, направленное на этот адрес: 200 на `/`,
# 403 на `/app/.env`. То есть содержимое можно было открыть (и проиндексировать)
# под чужим именем, а сканеры получали подтверждение, что по адресу что-то
# живёт.
#
# Теперь неизвестное имя получает 444: nginx закрывает соединение молча, не
# отдавая ни тела, ни заголовков. 404 тоже был бы верен, но тратит ответ на
# того, кому отвечать незачем.
#
# Что сюда попало, видно в отдельном журнале — вместе с именем хоста. Если
# окажется, что закрыли нужное, это будет видно сразу, а не через месяц.

log_format unknown_host '$remote_addr [$time_local] host="$host" "$request" '
                        '$status "$http_user_agent"';

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    access_log /var/log/nginx/unknown-host.log unknown_host;

    # Выпуск и продление сертификатов идут по имени домена и сюда не попадают,
    # поэтому исключение для acme-challenge не нужно.
    return 444;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    # Рукопожатие происходит до того, как nginx узнает имя хоста, поэтому
    # сертификат обязателен: без него соединение обрывалось бы ошибкой TLS, и
    # причина «домен не наш» была бы неотличима от «сертификат протух».
    # Берём apex — он покрывает и `www`, и обновляется чаще прочих. Раньше при
    # обращении по адресу отдавался сертификат `api.modelizmclub.ru`: именно
    # этот блок был умолчательным по порядку загрузки.
    #
    # `http2` повторяет остальные блоки намеренно: параметры слушающего сокета
    # берутся из первого встреченного `listen`, а conf.d подключается раньше
    # sites-enabled. Без него http2 выключился бы на всех доменах.
    ssl_certificate     /etc/letsencrypt/live/modelizmclub.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/modelizmclub.ru/privkey.pem;

    # Список протоколов для всего сокета берётся из умолчательного сервера:
    # ClientHello приходит раньше, чем nginx узнаёт имя хоста, а выбирать
    # `ssl_protocols` по SNI он научился только в 1.29.2 — на проде 1.24.
    # До этой правки умолчательным был `api`, и TLS 1.2+ приезжал оттуда;
    # теперь умолчательный — этот блок, и без строки ниже наследовалось бы
    # `TLSv1 TLSv1.1 TLSv1.2 TLSv1.3` из `http{}` стокового nginx.conf Ubuntu.
    #
    # На проде 1.0 и 1.1 отвергаются и без неё — их закрывает OpenSSL 3.0
    # уровнем безопасности дистрибутива, проверено алертом 70 в ответ на
    # `-tls1_1`. Но это чужая настройка, которая переживёт не всякое
    # обновление, и гарантия на неё опираться не должна.
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/unknown-host.log unknown_host;

    return 444;
}

# api.modelizmclub.ru
#
# Этот файл — то, что действительно обслуживает домен. 07.09 выяснилось, что
# /etc/nginx/sites-enabled/api.modelizmclub.ru.conf был обычным файлом, а не
# симлинком на sites-available: правка sites-available ни на что не влияла.
# Теперь sites-enabled — симлинк, и версия одна.
#
# Содержимое ниже совпадало с репозиторием байт в байт; расхождения, о котором
# я писал ранее, не было — сравнение шло с устаревшей копией в sites-available.

# Кеш отдачи медиа.
#
# Каждый запрос картинки поднимал PHP и читал файл из S3: замер 07.09 —
# постер в 8,7 КБ отдавался в среднем за 1,61 с, минимум 0,95, максимум 5,35.
# Это половина LCP ленты и причина того, что он двузначен.
#
# Кешируются только ответы 200. Раньше здесь стояло, что это безопасно по
# построению, потому что `ServeMediaController` отдаёт 200 лишь для назначений
# из белого списка `PUBLIC_PURPOSES`, а всё прочее — 403.
#
# Это перестало быть верным 08.09, когда в контроллере появился
# `mayViewPrivate`: доказательства по спору тоже отдают 200 — тому, кому
# положено. А ключ кеша ниже — `$scheme$request_method$host$request_uri`, без
# `Authorization` и `Cookie`. То есть первый просмотр авторизованным складывал
# приватный файл в общий кеш на 30 дней, и дальше тот же адрес отдавал его без
# токена: до PHP запрос не доходил. Конфиг за правкой кода тогда не пошёл;
# исправлено 03.10, двумя преградами сразу.
#
# Первая — в приложении: непубличные назначения уходят с
# `Cache-Control: private, no-store`, и nginx такой ответ не сохраняет
# (`fastcgi_ignore_headers` здесь не задан, значит `Cache-Control` он уважает).
#
# Вторая — ниже, `$media_no_cache`: запрос с заголовком `Authorization` не
# читает и не пишет общий кеш вообще, чем бы приложение ни пометило ответ.
# Картинки это не задевает: `<img>` и `<audio>` ходят за медиа без заголовка
# (в этом и смысл открытого прокси), токен посылает только явная выборка
# файла в blob — frontend/src/lib/api/media.ts. То есть кешируется ровно
# анонимная отдача, а она и так публичная.
fastcgi_cache_path /var/cache/nginx/media levels=1:2 keys_zone=media:16m
                   max_size=2g inactive=30d use_temp_path=off;

# 1 — кеш обходим и не пишем. Таких случаев два: запрос не про медиа и запрос
# с токеном. Склеены в одну переменную, потому что `fastcgi_no_cache` и
# `fastcgi_cache_bypass` принимают список, но срабатывают на любом непустом и
# не равном нулю значении — два отдельных `map` дали бы «0» от одного и «1» от
# другого, и это читалось бы как «не кешировать» всегда.
map $request_uri $media_uri_no_cache {
    default           1;
    ~^/api/v1/media/  0;
}

map $http_authorization $media_auth_no_cache {
    default  1;
    ""       0;
}

map "$media_uri_no_cache$media_auth_no_cache" $media_no_cache {
    default  1;
    "00"     0;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.modelizmclub.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.modelizmclub.ru;

    root /var/www/modelizmclub/backend/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/api.modelizmclub.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.modelizmclub.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Заголовки безопасности.
    #
    # До 11.09 здесь стояли только первые два, и до клиента не доходил ни
    # один: `add_header` внутри location отменяет всё, что объявлено уровнем
    # выше, а через `location ~ \.php$` проходит каждый ответ API — там
    # объявлен X-Media-Cache. Замер `curl -I` по /api/v1/health возвращал
    # ровно один заголовок, x-media-cache. Поэтому весь набор продублирован
    # внутри location; выносить в snippets нельзя — сверка nginx-drift
    # смотрит только на файлы из deploy/nginx и снаружи их не видит.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 1024M;

    # Сжатие ответов API.
    #
    # До 11.09 здесь не было ничего, и API отдавал JSON как есть. Стоковый
    # /etc/nginx/nginx.conf Ubuntu включает `gzip on`, но `gzip_types`
    # оставляет закомментированным — то есть сжимается только text/html, а
    # application/json не сжимается никогда. У сайта своя настройка стоит с
    # 03.09; на соседний домен её не перенесли, и заметить это можно было
    # только по `curl -H "Accept-Encoding: gzip"`, который возвращал ответ
    # без content-encoding.
    #
    # Замерено 11.09 на боевых ответах:
    #
    #   /api/v1/public/bootstrap    39,0 КБ → 5,6 КБ   −86 %
    #   /api/v1/listings?per_page=24 53,4 КБ → 6,8 КБ   −87 %
    #   /api/v1/categories/posts     8,3 КБ → 1,2 КБ   −85 %
    #   /api/v1/public/faq           6,0 КБ → 1,0 КБ   −83 %
    #
    # Bootstrap стоит на критическом пути: его ждёт beforeLoad корневого
    # маршрута, то есть первый экран любой страницы.
    #
    # Картинки и видео в gzip_types не входят намеренно: они уже сжаты, и
    # повторное сжатие только тратит процессор.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/json application/problem+json text/plain text/css
               application/javascript text/javascript application/xml image/svg+xml;

    # Отладочная панель Laravel закрыта наглухо.
    #
    # Замерено 03.10: на боевом домене `POST /_ignition/execute-solution`
    # отвечал 500, а не 404 — то есть маршрут существовал и запрос до него
    # доходил. Появился он потому, что на проде стоял полный набор
    # зависимостей разработки: `spatie/laravel-ignition` в `require-dev`, а в
    # `vendor/` лежал с 10 сентября вместе с phpunit, faker, mockery, pint,
    # collision и sail. Выкатка зависимости не ставила вовсе, значит убрать их
    # было некому.
    #
    # Через `execute-solution` исторически исполняли код (CVE-2021-3129).
    # Нынешняя версия от того случая закрыта, но отладочной панели на боевом
    # домене делать нечего ни в какой версии, а `update-config` пишет настройки.
    #
    # Это вторая преграда, не первая. Первая — `composer install --no-dev` в
    # выкатке: пакета на проде просто не будет. Преграда здесь стоит потому,
    # что пакет может вернуться — хватит одного `composer install` руками, — и
    # тогда адрес снова откроется, а узнать об этом будет не по чему.
    location ^~ /_ignition {
        access_log off;
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 3600s;

        fastcgi_cache media;
        fastcgi_cache_key "$scheme$request_method$host$request_uri";
        fastcgi_cache_valid 200 30d;
        # http_502/504 — значения proxy_cache; у fastcgi_cache их нет.
        fastcgi_cache_use_stale error timeout updating http_500 http_503;
        fastcgi_cache_background_update on;
        fastcgi_cache_lock on;
        fastcgi_no_cache $media_no_cache;
        fastcgi_cache_bypass $media_no_cache;
        add_header X-Media-Cache $upstream_cache_status always;
        # Повтор серверных заголовков: строка выше их отменила.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

# api.modelizmclub.ru
#
# Этот файл — то, что действительно обслуживает домен. 07.09 выяснилось, что
# /etc/nginx/sites-enabled/api.modelizmclub.ru.conf был обычным файлом, а не
# симлинком на sites-available: правка sites-available ни на что не влияла.
# Теперь sites-enabled — симлинк, и версия одна.
#
# Содержимое ниже совпадало с репозиторием байт в байт; расхождения, о котором
# я писал ранее, не было — сравнение шло с устаревшей копией в sites-available.

# Кеш отдачи медиа.
#
# Каждый запрос картинки поднимал PHP и читал файл из S3: замер 07.09 —
# постер в 8,7 КБ отдавался в среднем за 1,61 с, минимум 0,95, максимум 5,35.
# Это половина LCP ленты и причина того, что он двузначен.
#
# Кешируются только ответы 200, и это безопасно по построению:
# ServeMediaController отдаёт 200 лишь для назначений из белого списка
# PUBLIC_PURPOSES, всё прочее — 403. Ответы уже помечены
# `immutable, max-age=31536000`.
fastcgi_cache_path /var/cache/nginx/media levels=1:2 keys_zone=media:16m
                   max_size=2g inactive=30d use_temp_path=off;

# 1 — запрос не про медиа: кеш обходим и не пишем.
map $request_uri $media_no_cache {
    default           1;
    ~^/api/v1/media/  0;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.modelizmclub.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.modelizmclub.ru;

    root /var/www/modelizmclub/backend/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/api.modelizmclub.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.modelizmclub.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    client_max_body_size 1024M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 3600s;

        fastcgi_cache media;
        fastcgi_cache_key "$scheme$request_method$host$request_uri";
        fastcgi_cache_valid 200 30d;
        # http_502/504 — значения proxy_cache; у fastcgi_cache их нет.
        fastcgi_cache_use_stale error timeout updating http_500 http_503;
        fastcgi_cache_background_update on;
        fastcgi_cache_lock on;
        fastcgi_no_cache $media_no_cache;
        fastcgi_cache_bypass $media_no_cache;
        add_header X-Media-Cache $upstream_cache_status always;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

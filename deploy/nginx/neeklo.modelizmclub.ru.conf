# Neeklo agent frontend (TanStack Start / Nitro on :3002).
server {
    listen 80;
    listen [::]:80;
    server_name neeklo.modelizmclub.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name neeklo.modelizmclub.ru;

    ssl_certificate     /etc/letsencrypt/live/neeklo.modelizmclub.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/neeklo.modelizmclub.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    client_max_body_size 50M;

    # Same compression and static-file handling as modelizmclub.ru.conf — the
    # stand is where this gets verified before it reaches production.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    # Build assets from disk. `.output` is a symlink into .worktrees/ on this
    # stand (worktree deploy); nginx follows it.
    location /assets/ {
        root /var/www/modelizmclub-neeklo/frontend/.output/public;
        try_files $uri =404;
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Video from disk — real 206 range responses instead of Nitro's 200.
    location /videos/ {
        root /var/www/modelizmclub-neeklo/frontend/.output/public;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800" always;
        add_header Accept-Ranges bytes always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

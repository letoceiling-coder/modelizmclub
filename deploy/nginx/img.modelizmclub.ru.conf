server {
    listen 80;
    listen [::]:80;
    server_name img.modelizmclub.ru;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name img.modelizmclub.ru;

    root /var/www/modelizmclub-cloude/public;
    index index.php;
    charset utf-8;
    client_max_body_size 220M;

    ssl_certificate     /etc/letsencrypt/live/img.modelizmclub.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/img.modelizmclub.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options "nosniff" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }
}

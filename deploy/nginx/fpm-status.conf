# PHP-FPM status, reachable only from the machine itself.
#
# It listens on 127.0.0.1 rather than being a guarded location on a public
# vhost: an allow/deny list is one typo away from exposing the pool internals,
# while a loopback socket cannot be reached from outside at all. Read it over
# ssh, or forward the port: ssh -L 8081:127.0.0.1:8081 root@<host>
server {
    listen 127.0.0.1:8081;
    server_name localhost;

    access_log off;

    location = /fpm-status {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location = /fpm-ping {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location / { return 404; }
}

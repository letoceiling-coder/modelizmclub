# Production frontend (TanStack Start / Nitro node-server on :3000).
server {
    listen 80;
    listen [::]:80;
    server_name modelizmclub.ru www.modelizmclub.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name modelizmclub.ru www.modelizmclub.ru;

    ssl_certificate     /etc/letsencrypt/live/modelizmclub.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/modelizmclub.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Что странице разрешено просить у браузера. Камера, микрофон и захват
    # экрана оставлены: на них живут звонки через LiveKit и запись голосовых
    # в мессенджере — запрет сломал бы их молча. Геолокацией, платёжным API,
    # USB, MIDI и датчиками приложение не пользуется ни в одном месте
    # (проверено поиском по src: только getUserMedia в calls.ts и
    # VoiceRecorder.tsx).
    add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=(), payment=(), usb=(), midi=(), magnetometer=(), gyroscope=(), accelerometer=(), ambient-light-sensor=(), autoplay=(self), fullscreen=(self)" always;

    # CSP пока в режиме отчёта: браузер ничего не блокирует, а присылает то,
    # что заблокировал бы, на /csp-report. Включать всерьёз можно только
    # после разбора собранного — CSP ломает страницу целиком и молча.
    #
    # 'unsafe-inline' в script-src и style-src — не небрежность: TanStack
    # Start кладёт в разметку встроенный скрипт темы и данные гидрации, а
    # framer-motion пишет стили инлайном. Убрать их можно только через nonce,
    # и это отдельная работа, а не строчка в конфиге.
    #
    # Список источников собран по бандлу и окружению: R2 отдаёт медиа,
    # dicebear — заглушки аватаров, ws.modelizmclub.ru — Reverb,
    # livekit.modelizmclub.ru — звонки, домены ВТБ и ЮKassa — формы оплаты.
    # Отчёты покажут, чего в этом списке не хватает.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https://api.modelizmclub.ru https://img.modelizmclub.ru https://pub-bb2e103a32db4e198524a2e9ed8f35b4.r2.dev https://api.dicebear.com; media-src 'self' blob: https://api.modelizmclub.ru https://pub-bb2e103a32db4e198524a2e9ed8f35b4.r2.dev; connect-src 'self' https://api.modelizmclub.ru https://img.modelizmclub.ru https://pub-bb2e103a32db4e198524a2e9ed8f35b4.r2.dev https://api.dicebear.com wss://ws.modelizmclub.ru wss://livekit.modelizmclub.ru https://livekit.modelizmclub.ru; worker-src 'self' blob:; frame-src 'self' https://platezh.vtb24.ru https://vtb.rbsuat.com https://test-pay.vtb.ru https://yookassa.ru; form-action 'self' https://platezh.vtb24.ru https://vtb.rbsuat.com https://test-pay.vtb.ru https://yookassa.ru; report-uri /csp-report" always;

    client_max_body_size 1024M;

    # Compression. Ubuntu's stock /etc/nginx/nginx.conf has `gzip on` but leaves
    # gzip_types and gzip_proxied commented out, so only text/html was ever
    # compressed and nothing behind proxy_pass was: index-*.js went out at
    # 2.27 MB where gzip gives 668 KB (measured 2026-09-03). Declared here so the
    # repo owns it rather than a hand-edit to the global file.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    # VK ID OAuth callback — script-free 302 per VK ID docs (no JS on redirect page).
    location = /oauth/vk/callback {
        return 302 https://api.modelizmclub.ru/api/v1/auth/oauth/vk/callback$is_args$args;
    }

    # Приёмник отчётов CSP. Проксируется на API, а не указывается в политике
    # напрямую: отчёт на чужой origin браузер шлёт с проверкой CORS, и часть
    # отчётов из-за неё просто не доходит. Со своего адреса доходят все.
    location = /csp-report {
        proxy_pass https://api.modelizmclub.ru/api/v1/csp-report;
        proxy_set_header Host api.modelizmclub.ru;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    location = /safe-deals {
        return 301 /deals;
    }
    location = /safe-deals/ {
        return 301 /deals;
    }
    location = /safe-deal {
        return 301 /rules/safe-deal;
    }
    location = /safe-deal/ {
        return 301 /rules/safe-deal;
    }

    # Laravel API (master backend) — webhooks, same code as api.modelizmclub.ru.
    location ^~ /api/ {
        client_max_body_size 1024M;
        include fastcgi.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param DOCUMENT_ROOT /var/www/modelizmclub/backend/public;
        fastcgi_param SCRIPT_FILENAME /var/www/modelizmclub/backend/public/index.php;
        fastcgi_read_timeout 3600s;
    }

    # Swagger / OpenAPI docs (Scramble) — /docs/api UI + /docs/api.json spec,
    # served by the master backend (gated by the viewApiDocs gate).
    location ^~ /docs {
        include fastcgi.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param DOCUMENT_ROOT /var/www/modelizmclub/backend/public;
        fastcgi_param SCRIPT_FILENAME /var/www/modelizmclub/backend/public/index.php;
        fastcgi_read_timeout 3600s;
    }

    # Content-hashed build assets — filenames change on every build (Vite
    # fingerprints), so they are safe to cache forever. Served straight from
    # disk: nginx compresses and range-serves natively, and Node is not in the
    # path for a static file. `.output` may be a symlink into .worktrees/ after
    # a worktree deploy — nginx follows it (disable_symlinks is off by default).
    location /assets/ {
        root /var/www/modelizmclub/frontend/.output/public;
        try_files $uri =404;
        access_log off;
        # add_header in a location drops the server-level ones — re-declare.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Hero / static video. Proxying this through Nitro advertised
    # `Accept-Ranges: bytes` but answered every Range request with a 200 and
    # the whole 6 MB file — Nitro's static handler does not do ranges — which
    # is what the browser reports as net::ERR_ABORTED. Serving from disk gives
    # real 206 responses, plus a cache header the video never had.
    location /videos/ {
        root /var/www/modelizmclub/frontend/.output/public;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # SSR HTML documents and everything else — must never be cached, otherwise browsers
    # keep loading an old document that references stale asset hashes. With no-cache every
    # deploy is picked up automatically and no user ever needs to clear their cache.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # `add_header` in a location resets inherited headers, so re-declare the
        # security headers here alongside the no-cache policy.
        proxy_hide_header Cache-Control;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=(), payment=(), usb=(), midi=(), magnetometer=(), gyroscope=(), accelerometer=(), ambient-light-sensor=(), autoplay=(self), fullscreen=(self)" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https://api.modelizmclub.ru https://img.modelizmclub.ru https://pub-bb2e103a32db4e198524a2e9ed8f35b4.r2.dev https://api.dicebear.com; media-src 'self' blob: https://api.modelizmclub.ru https://pub-bb2e103a32db4e198524a2e9ed8f35b4.r2.dev; connect-src 'self' https://api.modelizmclub.ru https://img.modelizmclub.ru https://pub-bb2e103a32db4e198524a2e9ed8f35b4.r2.dev https://api.dicebear.com wss://ws.modelizmclub.ru wss://livekit.modelizmclub.ru https://livekit.modelizmclub.ru; worker-src 'self' blob:; frame-src 'self' https://platezh.vtb24.ru https://vtb.rbsuat.com https://test-pay.vtb.ru https://yookassa.ru; form-action 'self' https://platezh.vtb24.ru https://vtb.rbsuat.com https://test-pay.vtb.ru https://yookassa.ru; report-uri /csp-report" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
}
